#
# ui-deliverables：只关原生轮尾卡（dsh-file-review-kcoder 插件接管该行，
# 否则同 turn 双卡：插件审查卡 + 原生 monospace 卡并列）。patch 的 config
# 是整行替换语义——该行原本无 config，无键可漏；其余注册（Definition /
# present 工具行 / changes-review 侧栏 Tab / /api/present.host 路由）
# 不受影响。生效需重启 dsh 进程 + 刷新页面（名册启动时烤进 __DSH_BOOT__）。
- id: ui-deliverables
  config:
    tailCard: false

# ── settings.yaml 一次性导入未落位的用户值（2026-09-22 手工迁移，源 settings.yaml.imported）──
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
