# ── graphrag（dsh-kylin-vibe）：补上模型路由 ───────────────────────────────
# 排查（2026-10-03）：插件自带 patch 里 graphrag-provider-local 的 model 是注释
# 状态 → 该行 config.model 解析为 null → status 报 llmAvailable=false，
# graphrag_index 在 LLM 门直接抛 [NO_PROVIDER]，索引根本没机会启动（与审批无关）。
# patch 的 config 是整行替换语义：该行原有 roots 必须一并带上，否则会被抹掉。
- id: graphrag-provider-local
  config:
    roots: [] # 保持原值；本机 KB「coding知识库」的授权根在 registry 内
    model:
      # 两者都必须非空才生效（0.1.2 无「跟随宿主当前选择」回退）
      provider: qwen-token-plan-cn
      model: deepseek-v4.1-flash
- id: dsh-kylin-memory
  name: dsh-kylin-memory
  config:
    assistantTools: search
    extractionEnabled: true
    recallEnabled: true
    messageRetention:
      keep: all
      recentTurns: 0
      retentionDays: 0
      batchSize: 500
      dryRun: false
    contextCompactionEnabled: true
    recallScope: all
    projectCompletedTurnTools: true
    freshTurnCount: 50
    maintenanceInterval: 50
    recallMaxNodes: 20
    semanticScoreThreshold: 0.8
  disabled: false
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: zai-coding-cn
        model: glm-5.3-flash
- id: optional-terminal-pwsh
  disabled: true
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
